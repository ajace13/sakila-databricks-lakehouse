name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: March files are reproducible, and the pipeline passes every layer check
        run: pytest -v
      - name: Full run, printed
        run: PYTHONPATH=src python -m lakehouse --warehouse /tmp/warehouse
